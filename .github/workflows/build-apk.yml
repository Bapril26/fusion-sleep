name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the test APK on the Releases page

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  # ── Test APK: installable on any phone, includes "Unlock Pro for testing" ──
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Type-check and build the app (test build)
        env:
          VITE_TEST_BUILD: 'true'
          VITE_STORY_API_URL: ${{ vars.STORY_API_URL }}
          VITE_STORY_APP_KEY: ${{ vars.STORY_APP_KEY }}
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android

      - name: Use the shared test signing key (so new test APKs install over old ones)
        run: |
          mkdir -p ~/.android
          cp android-src/signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Fusion-Sleep-test.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fusion-sleep-test-apk
          path: Fusion-Sleep-test.apk

      - name: Publish APK to the Releases page (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest Fusion-Sleep-test.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Fusion Sleep ${VERSION} — test build" \
            --notes "Test APK built from commit ${GITHUB_SHA::7}. Install on an Android phone to test. Includes Settings → Tester tools → Unlock Pro for testing (no payment). Not for the Play Store."

  # ── Play Store bundle: signed with your upload key (needs 3 repository secrets) ──
  play-bundle:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check signing key
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Play Store bundle skipped: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets (see UPLOAD-KEY-DETAILS.txt)."
          fi

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build release bundle
        if: env.HAS_KEY == 'true'
        env:
          VITE_TEST_BUILD: 'false'
          VITE_STORY_API_URL: ${{ vars.STORY_API_URL }}
          VITE_STORY_APP_KEY: ${{ vars.STORY_APP_KEY }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_PASS"
          cp app/build/outputs/bundle/release/app-release.aab ../fusion-sleep-release.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload Play Store bundle
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fusion-sleep-play-store-aab
          path: fusion-sleep-release.aab
